<style>
  /* ===== 基础与背景 ===== */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; font-size:16px; scroll-padding-top: 5rem; }
  /* 真实隐藏滚动条（原 scrollbar-none 非 Tailwind 默认类，此处补齐跨浏览器实现） */
  .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  .scrollbar-none::-webkit-scrollbar { display: none; }

  /* ===== 顶部阅读进度条 ===== */
  #readProgress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0%;
    z-index: 60;
    background: linear-gradient(90deg, #4f46e5, #06b6d4);
    box-shadow: 0 0 10px rgba(6,182,212,0.6);
    transition: width 0.08s linear;
  }

  /* ===== 区块标题：渐变文字 + 渐变短下划线 ===== */
  .section-title {
    background: linear-gradient(90deg, #e0e7ff 0%, #22d3ee 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative; display: inline-block; padding-bottom: 7px;
  }
  .section-title::after {
    content: ""; position: absolute; left: 0; bottom: 0;
    width: 44px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, #4f46e5, #06b6d4);
    box-shadow: 0 0 8px rgba(6,182,212,0.5);
  }

  /* ===== 玻璃卡片光标聚光 ===== */
  .glass-card { position: relative; overflow: hidden; }
  .glass-card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(200px circle at var(--cx, 50%) var(--cy, 50%),
                rgba(99,102,241,0.16), transparent 60%);
    opacity: 0; transition: opacity 0.35s ease;
  }
  .glass-card:hover::after { opacity: 1; }

  /* ===== Hero 头像旋转光环 + 名字辉光 ===== */
  .avatar-ring { position: relative; }
  .avatar-ring::before {
    content: ""; position: absolute; inset: -6px; border-radius: 9999px;
    background: conic-gradient(from 0deg, #4f46e5, #06b6d4, #818cf8, #4f46e5);
    z-index: -1; filter: blur(7px); opacity: 0.75;
    animation: avatarSpin 8s linear infinite;
  }
  @keyframes avatarSpin { to { transform: rotate(360deg); } }
  .hero-name { text-shadow: 0 0 30px rgba(99,102,241,0.35); }

  /* ===== 流动渐变背景 mesh ===== */
  #meshBg {
    position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40% 40% at 18% 28%, rgba(79,70,229,0.10), transparent 60%),
      radial-gradient(36% 36% at 82% 72%, rgba(6,182,212,0.08), transparent 60%),
      radial-gradient(30% 30% at 60% 18%, rgba(129,140,248,0.07), transparent 60%);
    animation: meshDrift 18s ease-in-out infinite alternate;
  }
  @keyframes meshDrift {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(2%, -3%) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .avatar-ring::before, #meshBg { animation: none !important; }
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #030712;
    color: #f1f5f9;
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.2s ease;
  }

  /* ===== 主题强调色变量（动态背景色切换驱动） ===== */
  :root {
    --accent-glow-1: rgba(6,182,212,0.12);   /* .glow-bg::before 光斑（左上） */
    --accent-glow-2: rgba(79,70,229,0.15);   /* .glow-bg::after 光斑（右下） */
  }

  /* ===== 开屏动画 ===== */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
    background: #030712;
    overflow: hidden;
    transition: opacity 0.65s ease, visibility 0.65s ease;
  }
  #splash.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #splash > canvas:not(.splash-name-canvas) {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  .splash-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
  }
  /* ===== 鼠标光标背景高亮 ===== */
  #cursorGlow {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(140px circle at var(--mx, 50%) var(--my, 50%),
                rgba(99,102,241,0.14) 0%, rgba(34,211,238,0.08) 35%, transparent 70%);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #cursorGlow.active { opacity: 1; }

  .splash-enter-btn {
    margin-top: 0.6rem;
    padding: 0.7rem 1.8rem;
    border-radius: 999px;
    border: 1px solid rgba(34,211,238,0.35);
    background: linear-gradient(135deg, rgba(79,70,229,0.85) 0%, rgba(6,182,212,0.85) 100%);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(79,70,229,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    animation: splashFadeUp 0.7s ease 0.55s both;
  }
  .splash-enter-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 12px 38px rgba(34,211,238,0.5);
  }
  .splash-enter-btn:active { transform: translateY(0); }
  .splash-name-wrap {
    position: absolute;
    top: 44%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .splash-name-wrap::before {        /* 主题柔光晕，呼应页面靛蓝/青配色 */
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: min(70vw, 380px);
    height: 200px;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center,
                rgba(79,70,229,0.30) 0%, rgba(34,211,238,0.16) 45%, transparent 72%);
    filter: blur(10px);
    z-index: -1;
    pointer-events: none;
  }
  /* 下方内容容器：副标题、进度条、按钮，统一位于「陈成睿」之下 */
  .splash-bottom {
    position: absolute;
    top: 56%;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
    z-index: 3;
  }
  .splash-name {
    font-size: clamp(2.8rem, 11vw, 5rem);
    font-weight: 800;
    letter-spacing: 0.12em;
    line-height: 1.1;
    background: linear-gradient(120deg, #818cf8 0%, #22d3ee 52%, #4f46e5 100%);
    background-size: 220% 220%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(99,102,241,0.45));
    opacity: 0;
    animation: splashNameIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both,
               splashSheen 4.5s ease-in-out 0.9s infinite;
  }
  .splash-name-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50vh;            /* 仅覆盖上半屏：流星从页面最上方飞入，且不波及下方副标题/按钮 */
    pointer-events: none;
    z-index: 1;
  }
  /* 无障碍/降级：默认视觉隐藏，供屏幕阅读器读取；减动效模式下显示为普通文字 */
  .splash-name-fallback {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); clip-path: inset(50%);
    white-space: nowrap; border: 0;
  }
  .splash-sub {
    font-size: clamp(0.82rem, 3.4vw, 1.05rem);
    font-weight: 500;
    letter-spacing: 0.26em;
    color: rgba(165,180,252,0.85);
    opacity: 0;
    animation: splashFadeUp 0.7s ease 0.5s both;
  }
  @keyframes splashNameIn {
    0%   { transform: translateY(16px) scale(0.96); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes splashSheen {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  .splash-bar {
    width: 132px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    opacity: 0;
    animation: splashFadeUp 0.7s ease 0.4s both;
  }
  .splash-bar > span {
    display: block;
    height: 100%;
    width: 42%;
    border-radius: 999px;
    background: linear-gradient(90deg, #4f46e5, #06b6d4);
    animation: splashSlide 1.1s ease-in-out infinite;
  }
  @keyframes splashFadeUp {
    0%   { transform: translateY(8px); opacity: 0; }
    100% { transform: translateY(0);   opacity: 1; }
  }
  @keyframes splashSlide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(285%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash .splash-name,
    #splash .splash-sub,
    #splash .splash-bar,
    #splash .splash-bar > span,
    .splash-enter-btn {
      animation: none !important;
      opacity: 1 !important;
    }
    #splash .splash-name-canvas { display: none; }
    #splash .splash-name-fallback {
      position: static; width: auto; height: auto; margin: 0;
      overflow: visible; clip: auto; clip-path: none; white-space: normal;
    }
    .reveal {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
  }

  /* ===== 背景发光光斑 ===== */
  .glow-bg {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .glow-bg::before {
    content: '';
    position: absolute;
    top: -200px;
    left: -200px;
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, var(--accent-glow-1) 0%, transparent 70%);
    filter: blur(140px);
    border-radius: 50%;
    transition: background 1.2s ease;
  }
  .glow-bg::after {
    content: '';
    position: absolute;
    bottom: -200px;
    right: -200px;
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, var(--accent-glow-2) 0%, transparent 70%);
    filter: blur(140px);
    border-radius: 50%;
    transition: background 1.2s ease;
  }

  /* ===== 毛玻璃卡片 ===== */
  .glass-card {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 1rem;
    transition: all 0.2s ease;
  }
  .glass-card:hover {
    border-color: rgba(34, 211, 238, 0.3);
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.08), 0 8px 32px rgba(0,0,0,0.3);
  }

  /* ===== 滚动入场动画 ===== */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .reveal.is-visible {
    opacity: 1;
    transform: none;
  }
  /* 技能条填充发光 */
  .skill-fill {
    box-shadow: 0 0 10px rgba(34, 211, 238, 0.45);
  }

  /* ===== 胶囊徽章 ===== */
  .badge-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 500;
    background: rgba(6, 182, 212, 0.08);
    border: 1px solid rgba(6, 182, 212, 0.25);
    color: #67e8f9;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .badge-pill:hover {
    background: rgba(6, 182, 212, 0.15);
    border-color: rgba(6, 182, 212, 0.4);
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
  }

  /* ===== 按钮辉光 ===== */
  .btn-glow {
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .btn-glow:hover {
    box-shadow: 0 0 30px rgba(79, 70, 229, 0.5), 0 0 60px rgba(6, 182, 212, 0.2);
    transform: translateY(-2px);
  }
  .btn-glow:active {
    transform: translateY(0);
    box-shadow: 0 0 15px rgba(79, 70, 229, 0.3);
  }
  .btn-glow-outline:hover {
    border-color: rgba(6, 182, 212, 0.5);
    color: #22d3ee;
    background: rgba(6, 182, 212, 0.06);
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
  }

  /* ===== 导航栏 ===== */
  .navbar-blur {
    background: rgba(3, 7, 18, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav-link {
    position: relative;
    transition: all 0.2s ease;
  }
  .nav-link:hover {
    color: #22d3ee;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: #06b6d4;
    border-radius: 2px;
    transition: width 0.25s ease;
  }
  .nav-link:hover::after {
    width: 70%;
  }
  .nav-link.active { color: #22d3ee; }
  .nav-link.active::after { width: 70%; }

  /* ===== 亮点卡片微发光 ===== */
  .metric-card {
    transition: all 0.3s ease;
  }
  .metric-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.15), 0 12px 40px rgba(0,0,0,0.4);
    border-color: rgba(6, 182, 212, 0.3);
  }
  .metric-number {
    background: linear-gradient(135deg, #ffffff 0%, #67e8f9 50%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
  }

  /* ===== Tab按钮 ===== */
  .tab-btn-custom {
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }
  .tab-btn-custom:hover {
    color: #22d3ee;
    background: rgba(6, 182, 212, 0.06);
  }
  .tab-btn-custom[aria-selected="true"] {
    background: rgba(79, 70, 229, 0.3);
    color: #fff;
    border-color: rgba(99, 102, 241, 0.5);
    box-shadow: 0 0 12px rgba(79, 70, 229, 0.3);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    z-index: 5000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(6, 182, 212, 0.3);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 0.85rem;
    color: #e2e8f0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }

  /* ===== 打印样式 ===== */
  @media print {
    .navbar-blur, .glow-bg, .toast, .btn-glow, .back-to-top, .btn, .tabs-custom, .lightbox, #bgCanvas {
      display: none !important;
    }
    body {
      background: #fff !important;
      color: #000 !important;
      padding-top: 0;
    }
    .glass-card {
      background: #fff !important;
      border: 1px solid #ddd !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .metric-number {
      -webkit-text-fill-color: #000 !important;
      background: none !important;
    }
    .tab-panel-custom {
      display: block !important;
      opacity: 1 !important;
    }
    .cert-img { max-width: 200px; }
  }

  /* ===== 响应式辅助 ===== */
  @media (max-width: 640px) {
    .hero-avatar-sm {
      width: 100px;
      height: 100px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }

  /* ===== 跳转主内容（无障碍） ===== */
  .skip-link {
    position: fixed; top: 8px; left: 8px; z-index: 200;
    background: #4f46e5; color: #fff; padding: 8px 14px; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600;
    transform: translateY(-150%);
    transition: transform 0.2s ease;
  }
  .skip-link:focus { transform: translateY(0); outline: 2px solid #22d3ee; outline-offset: 2px; }
</style>
</head>

  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#030712;color:#e2e8f0;text-align:center;padding:24px;font-family:sans-serif;z-index:300;">
    <div>
      <h1 style="font-size:1.6rem;margin-bottom:12px;font-weight:800;">陈成睿 · 个人简历</h1>

  </div>
</noscript>

<!-- ===== 开屏动画 ===== -->
<div id="splash">
  <canvas id="splashCanvas" aria-hidden="true"></canvas>
  <canvas id="splashNameCanvas" class="splash-name-canvas" aria-hidden="true"></canvas>
  <div class="splash-name-wrap">
    <div class="splash-name splash-name-fallback">陈成睿</div>
  </div>
  <div class="splash-bottom">
    <div class="splash-sub">化学工程与工艺 · 常州工学院</div>

    <button id="enterResumeBtn" class="splash-enter-btn" type="button">快来了解我吧</button>

</div>

<!-- ===== 背景光斑 ===== -->
<div class="glow-bg"></div>
<div id="meshBg" aria-hidden="true"></div>

<!-- ===== 动态 Canvas 粒子背景（形状聚合，z-1 浮于光斑之上、内容之下） ===== -->
<canvas id="bgCanvas" class="fixed inset-0 pointer-events-none" style="z-index:1;" aria-hidden="true"></canvas>

<!-- ===== 鼠标光标背景高亮 ===== -->
<div id="cursorGlow" aria-hidden="true"></div>

<!-- ===== 导航栏 ===== -->

    // 联系方式复制按钮的绑定已随"联系方式数据驱动渲染"一并完成（见上方 contactGrid 渲染）

    // Tab 激活

    // 重新初始化图标（包含新按钮）
    lucide.createIcons();

    // ===== 动态 Canvas 粒子背景 + 形状切换 =====
    (function initBgCanvas() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isMobile = window.matchMedia('(max-width: 767px)').matches;

      // 形状配置：绘制函数 + 粒子色 + 光斑色（切换时同步驱动 .glow-bg 与粒子色）
      const SHAPES = {
        heart: {
          particle: '#22d3ee',
          glow1: 'rgba(6,182,212,0.12)',
          glow2: 'rgba(8,145,178,0.16)',
          draw: function(c, x) {
            x.beginPath();
            let first = true;
            for (let t = 0; t <= Math.PI * 2; t += 0.01) {
              const px = 16 * Math.pow(Math.sin(t), 3);
              const py = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
              const dx = c.width / 2 + px * 10;
              const dy = c.height / 2 - py * 10; // canvas y 向下，数学 y 正向画到上方
              if (first) { x.moveTo(dx, dy); first = false; } else x.lineTo(dx, dy);
            }
            x.closePath();
            x.fill();
          }
        },
        star: {
          particle: '#a78bfa',
          glow1: 'rgba(139,92,246,0.14)',
          glow2: 'rgba(167,139,250,0.16)',
          draw: function(c, x) {
            const cx = c.width / 2, cy = c.height / 2;
            const outer = 180, inner = 72, spikes = 5;
            x.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
              const r = i % 2 === 0 ? outer : inner;
              const a = (Math.PI / spikes) * i - Math.PI / 2;
              const dx = cx + Math.cos(a) * r;
              const dy = cy + Math.sin(a) * r;
              if (i === 0) x.moveTo(dx, dy); else x.lineTo(dx, dy);
            }
            x.closePath();
            x.fill();
          }
        },
        cap: {
          particle: '#34d399',
          glow1: 'rgba(16,185,129,0.14)',
          glow2: 'rgba(52,211,153,0.16)',
          draw: function(c, x) {
            const cx = c.width / 2, cy = c.height / 2;
            // 菱形顶板
            x.beginPath();
            x.moveTo(cx, cy - 90);
            x.lineTo(cx + 160, cy - 20);
            x.lineTo(cx, cy + 50);
            x.lineTo(cx - 160, cy - 20);
            x.closePath();
            x.fill();
            // 帽体
            x.fillRect(cx - 60, cy + 10, 120, 70);
            // 流苏圆点
            x.beginPath();
            x.arc(cx + 120, cy - 10, 12, 0, Math.PI * 2);
            x.fill();
          }
        },
        chen: {
          particle: '#fbbf24',
          glow1: 'rgba(245,158,11,0.14)',
          glow2: 'rgba(251,191,36,0.16)',
          draw: function(c, x) {
            x.font = 'bold 300px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
            x.textAlign = 'center';
            x.textBaseline = 'middle';
            x.fillText('陈', c.width / 2, c.height / 2);
          }
        }
      };

      // 离屏采样：把形状画到 400x400 离屏 canvas，取 alpha>128 的归一化像素点（按形状缓存，避免每次切换重复栅格化）
      const shapePointCache = new Map();
      function getShapePoints(shapeKey) {
        if (shapePointCache.has(shapeKey)) return shapePointCache.get(shapeKey);
        const off = document.createElement('canvas');
        const S = 400;
        off.width = off.height = S;
        const oc = off.getContext('2d');
        oc.fillStyle = '#fff';
        SHAPES[shapeKey].draw(off, oc);
        const data = oc.getImageData(0, 0, S, S).data;
        const pts = [];
        for (let y = 0; y < S; y += 2) {
          for (let xx = 0; xx < S; xx += 2) {
            if (data[(y * S + xx) * 4 + 3] > 128) pts.push({ x: xx / S, y: y / S });
          }
        }
        // 洗牌（Fisher-Yates）
        for (let i = pts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp;
        }
        shapePointCache.set(shapeKey, pts);
        return pts;
      }
      function sampleTargets(shapeKey, N, vw, vh) {
        const pts = getShapePoints(shapeKey);
        const scale = Math.min(vw, vh) * 0.55;
        const cx = vw / 2, cy = vh / 2;
        const targets = [];
        for (let i = 0; i < N && i < pts.length; i++) {
          targets.push({ x: cx + (pts[i].x - 0.5) * scale, y: cy + (pts[i].y - 0.5) * scale });
        }
        return targets;
      }

      // 粒子
      function Particle(x, y) {
        this.x = x; this.y = y;
        this.tx = x; this.ty = y;
        this.vx = 0; this.vy = 0;
        this.size = 1.2 + Math.random() * 1.6;
        this.phase = Math.random() * Math.PI * 2;
      }
      Particle.prototype.setTarget = function(tx, ty) { this.tx = tx; this.ty = ty; };
      Particle.prototype.update = function() {
        const k = 0.045, damp = 0.86;
        this.vx = (this.vx + (this.tx - this.x) * k) * damp;
        this.vy = (this.vy + (this.ty - this.y) * k) * damp;
        this.phase += 0.03;
        this.x += this.vx + Math.sin(this.phase) * 0.4;
        this.y += this.vy + Math.cos(this.phase) * 0.4;
      };
      Particle.prototype.draw = function(x, color) {
        x.fillStyle = color;
        x.beginPath();
        x.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        x.fill();
      };

      // 状态
      let particles = [];
      let rafId = null;
      let currentShape = 'heart';
      let lastTs = 0;
      let vw = 0, vh = 0;
      let particleColor = SHAPES.heart.particle;
      const drawConnections = !isMobile;

      // 主页面流星雨：自上而下、慢速、持续（与开屏同款）
      const bgMeteorPalette = [['#22d3ee', '34,211,238'], ['#a5b4fc', '165,180,252'], ['#818cf8', '129,140,248']];
      let bgMeteors = [];
      function spawnBgMeteor(mt) {
        const mp = bgMeteorPalette[Math.floor(Math.random() * bgMeteorPalette.length)];
        const sp = 2 + Math.random() * 1.6;                 // 慢速
        mt.x = Math.random() * vw;
        mt.y = -20 - Math.random() * (vh * 0.5);            // 从屏幕上方进入
        mt.vx = (Math.random() - 0.5) * 0.4;                // 更垂直
        mt.vy = sp;                                         // 固定向下
        mt.len = 80 + Math.random() * 90;
        mt.maxLife = Math.ceil((vh + 260) / sp) + Math.floor(Math.random() * 30);
        mt.life = 0;
        mt.hex = mp[0]; mt.rgb = mp[1];
      }

      // 鼠标交互状态（用于粒子连线 + 背景高亮）
      const mouse = { x: -9999, y: -9999, active: false };
      if (!isMobile) {
        window.addEventListener('mousemove', function(e) {
          mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
        }, { passive: true });
        window.addEventListener('mouseout', function(e) {
          if (!e.relatedTarget) mouse.active = false;
        });
      }

      function resize() {
        vw = window.innerWidth;
        vh = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = vw * dpr;
        canvas.height = vh * dpr;
        canvas.style.width = vw + 'px';
        canvas.style.height = vh + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const N = isMobile ? 60 : Math.min(140, Math.floor(vw * vh / 14000));
        while (particles.length < N) particles.push(new Particle(vw / 2, vh / 2));
        if (particles.length > N) particles.length = N;
        const targets = sampleTargets(currentShape, N, vw, vh);
        particles.forEach(function(p, i) { if (targets[i]) p.setTarget(targets[i].x, targets[i].y); });
        // 主页面流星雨：数量随屏幕缩放
        const MN = Math.max(5, Math.floor(N / 14));
        bgMeteors = [];
        for (let i = 0; i < MN; i++) {
          const mt = {};
          spawnBgMeteor(mt);
          mt.life = Math.random() * mt.maxLife;             // 错峰出现
          bgMeteors.push(mt);
        }
      }

      function hexToRgb(hex) {
        return parseInt(hex.slice(1, 3), 16) + ',' + parseInt(hex.slice(3, 5), 16) + ',' + parseInt(hex.slice(5, 7), 16);
      }

      function loop(ts) {
        lastTs = ts;
        ctx.clearRect(0, 0, vw, vh);
        ctx.shadowBlur = 0;
        const rgb = hexToRgb(particleColor);
        if (drawConnections) {
          for (let i = 0; i < particles.length; i++) {
            const a = particles[i];
            for (let j = i + 1; j < particles.length; j++) {
              const b = particles[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              const d2 = dx * dx + dy * dy;
              if (d2 < 12100) { // 110^2
                const alpha = 0.12 * (1 - d2 / 12100);
                ctx.strokeStyle = 'rgba(' + rgb + ',' + alpha + ')';
                ctx.lineWidth = 0.6;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }
          }
        }
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw(ctx, particleColor);
        }
        ctx.globalCompositeOperation = 'source-over';
        // 鼠标交互：附近粒子与光标连线（高级感）
        if (mouse.active && drawConnections) {
          for (let i = 0; i < particles.length; i++) {
            const a = particles[i];
            const dx = a.x - mouse.x, dy = a.y - mouse.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < 16900) { // ~130px
              const alpha = 0.3 * (1 - d2 / 16900);
              ctx.strokeStyle = 'rgba(' + rgb + ',' + alpha + ')';
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.stroke();
            }
          }
        }
        // 主页面流星雨：淡入 → 下落 → 淡出，循环重生
        for (let i = 0; i < bgMeteors.length; i++) {
          const mt = bgMeteors[i];
          mt.x += mt.vx; mt.y += mt.vy; mt.life++;
          if (mt.life > mt.maxLife) { spawnBgMeteor(mt); continue; }
          const t = mt.life / mt.maxLife;
          const a = Math.sin(Math.PI * t) * 0.85;
          const sp = Math.hypot(mt.vx, mt.vy) || 1;
          const tailX = mt.x - (mt.vx / sp) * mt.len;
          const tailY = mt.y - (mt.vy / sp) * mt.len;
          const grad = ctx.createLinearGradient(tailX, tailY, mt.x, mt.y);
          grad.addColorStop(0, 'rgba(' + mt.rgb + ',0)');
          grad.addColorStop(1, 'rgba(' + mt.rgb + ',' + a + ')');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(mt.x, mt.y);
          ctx.stroke();
          ctx.globalAlpha = a;
          ctx.fillStyle = mt.hex;
          ctx.shadowBlur = 8; ctx.shadowColor = mt.hex;
          ctx.beginPath();
          ctx.arc(mt.x, mt.y, 1.7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        rafId = requestAnimationFrame(loop);
      }

      function switchShape(key) {
        if (!SHAPES[key]) return;
        currentShape = key;
        const cfg = SHAPES[key];
        particleColor = cfg.particle;
        // 同步切 CSS 变量 → .glow-bg 光斑色平滑过渡（1.2s）
        document.documentElement.style.setProperty('--accent-glow-1', cfg.glow1);
        document.documentElement.style.setProperty('--accent-glow-2', cfg.glow2);
        const targets = sampleTargets(key, particles.length, vw, vh);
        particles.forEach(function(p, i) { if (targets[i]) p.setTarget(targets[i].x, targets[i].y); });
      }

      // 自动循环切换形状（每 1 秒）：heart → star → cap → chen → heart
      const SHAPE_ORDER = ['heart', 'star', 'cap', 'chen'];
      let shapeIndex = SHAPE_ORDER.indexOf(currentShape);
      let shapeTimer = null;
      function startAutoSwitch() {
        stopAutoSwitch();
        shapeTimer = setInterval(function() {
          shapeIndex = (shapeIndex + 1) % SHAPE_ORDER.length;
          switchShape(SHAPE_ORDER[shapeIndex]);
        }, 5000);
      }
      function stopAutoSwitch() {
        if (shapeTimer) { clearInterval(shapeTimer); shapeTimer = null; }
      }

      // resize debounce
      let resizeTimer = null;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 200);
      });

      // 标签页隐藏时暂停 rAF 与形状自动切换 省电
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          stopAutoSwitch();
        } else if (!reduceMotion && !rafId) {
          lastTs = performance.now();
          rafId = requestAnimationFrame(loop);
          startAutoSwitch();
        }
      });

      // 启动：等字体就绪后采样（"陈"字依赖中文字体回退渲染）
      function start() {
        resize();
        if (reduceMotion) {
          ctx.clearRect(0, 0, vw, vh);
          for (let i = 0; i < particles.length; i++) particles[i].draw(ctx, particleColor);
        } else {
          lastTs = performance.now();
          rafId = requestAnimationFrame(loop);
          startAutoSwitch();
        }
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(start);
      } else {
        start();
      }
    })();

    // 开屏动画：内容就绪后优雅淡出（保留 DOM，便于重播）
    let splashRaf = null;
    function initSplashParticles() {
      const cv = document.getElementById('splashCanvas');
      if (!cv) return null;
      const ctx = cv.getContext('2d');
      let w = 0, h = 0, dpr = 1, parts = [];
      const m = { x: -9999, y: -9999, active: false };
      function resizeC() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = cv.clientWidth || window.innerWidth;
        h = cv.clientHeight || window.innerHeight;
        cv.width = w * dpr; cv.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resizeC();
      const N = Math.min(140, Math.floor(w * h / 11000)); // 增多粒子
      for (let i = 0; i < N; i++) {
        parts.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3, vy: 0.15 + Math.random() * 0.6, // 向下飘落
          r: 0.6 + Math.random() * 2.0, a: 0.2 + Math.random() * 0.55,
          c: Math.random() > 0.5 ? '#22d3ee' : '#818cf8'
        });
      }
      // 流星粒子：带拖尾、随机方向飞掠、淡入淡出循环
      const meteorPalette = [['#22d3ee', '34,211,238'], ['#a5b4fc', '165,180,252'], ['#818cf8', '129,140,248']];
      const meteors = [];
      function spawnMeteor(mt) {
        const mp = meteorPalette[Math.floor(Math.random() * meteorPalette.length)];
        const sp = 2 + Math.random() * 1.8;                 // 慢速：流星雨般连绵
        mt.x = Math.random() * w;
        mt.y = -20 - Math.random() * (h * 0.5);             // 从屏幕上方进入
        mt.vx = (Math.random() - 0.5) * 0.4;                // 更垂直，仅极轻微横向偏移
        mt.vy = sp;                                         // 固定向下
        mt.len = 80 + Math.random() * 90;                   // 拖尾长度
        mt.maxLife = Math.ceil((h + 260) / sp) + Math.floor(Math.random() * 30); // 足够划过整屏
        mt.life = 0;
        mt.hex = mp[0]; mt.rgb = mp[1];
      }
      const M = Math.max(6, Math.floor(N / 12));            // 流星数量随屏幕缩放
      for (let i = 0; i < M; i++) {
        const mt = {};
        spawnMeteor(mt);
        mt.life = Math.random() * mt.maxLife;               // 错峰出现，避免同时划过
        meteors.push(mt);
      }
      function frame() {
        ctx.clearRect(0, 0, w, h);
        // 鼠标交互：附近粒子与光标连线
        if (m.active) {
          for (const p of parts) {
            const dx = p.x - m.x, dy = p.y - m.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < 14400) { // ~120px
              const alpha = 0.28 * (1 - d2 / 14400);
              ctx.strokeStyle = 'rgba(129,140,248,' + alpha + ')';
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(m.x, m.y);
              ctx.stroke();
            }
          }
        }
        ctx.globalCompositeOperation = 'lighter';
        for (const p of parts) {
          p.x += p.vx; p.y += p.vy;
          if (p.y > h + 6) { p.y = -6; p.x = Math.random() * w; } // 落到底部回到顶部
          if (p.x < -6) p.x = w + 6; else if (p.x > w + 6) p.x = -6;
          ctx.globalAlpha = p.a;
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        // 流星：淡入 → 飞掠 → 淡出，循环重生
        for (const mt of meteors) {
          mt.x += mt.vx; mt.y += mt.vy; mt.life++;
          if (mt.life > mt.maxLife) { spawnMeteor(mt); continue; }
          const t = mt.life / mt.maxLife;
          const a = Math.sin(Math.PI * t) * 0.9;            // 两端淡、中间亮
          const sp = Math.hypot(mt.vx, mt.vy) || 1;
          const tailX = mt.x - (mt.vx / sp) * mt.len;
          const tailY = mt.y - (mt.vy / sp) * mt.len;
          const grad = ctx.createLinearGradient(tailX, tailY, mt.x, mt.y);
          grad.addColorStop(0, 'rgba(' + mt.rgb + ',0)');
          grad.addColorStop(1, 'rgba(' + mt.rgb + ',' + a + ')');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(mt.x, mt.y);
          ctx.stroke();
          // 明亮头部
          ctx.globalAlpha = a;
          ctx.fillStyle = mt.hex;
          ctx.shadowBlur = 8; ctx.shadowColor = mt.hex;
          ctx.beginPath();
          ctx.arc(mt.x, mt.y, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        splashRaf = requestAnimationFrame(frame);
      }
      window.addEventListener('resize', resizeC);
      window.addEventListener('mousemove', (e) => {
        m.x = e.clientX; m.y = e.clientY; m.active = true;
      }, { passive: true });
      window.addEventListener('mouseout', (e) => { if (!e.relatedTarget) m.active = false; });
      return {
        start() { if (!splashRaf) frame(); },
        stop() { if (splashRaf) { cancelAnimationFrame(splashRaf); splashRaf = null; } }
      };
    }

    // 开屏名字：「陈成睿」由粒子从上方飘落、汇聚形成
    let splashNameFx = null;
    (function initSplashName() {
      const cv = document.getElementById('splashNameCanvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const TEXT = '陈成睿';
      const FONT = '"Plus Jakarta Sans", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
      // 与开屏背景流星同款配色（亮色 + RGB 分量，用于渐变拖尾）
      const METEOR_PALETTE = [
        ['#22d3ee', '34,211,238'],
        ['#a5b4fc', '165,180,252'],
        ['#818cf8', '129,140,248']
      ];
      let w = 0, h = 0, parts = [], raf = null, started = false;
      let startT = 0, lastT = null;

      function build() {
        const vw = cv.clientWidth || window.innerWidth;
        const vh = cv.clientHeight || (window.innerHeight * 0.5);
        w = vw; h = vh;                          // 仅上半屏：流星从页面最上方飞入，不覆盖下方
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        // 依据宽度自适应字号（与屏幕宽度挂钩，不超过 560）
        const probe = 100;
        ctx.font = '800 ' + probe + 'px ' + FONT;
        const tw = ctx.measureText(TEXT).width || 1;
        const fontSize = Math.floor(probe * (Math.min(vw * 0.6, 360) - 12) / tw); // 字号整体缩小，更克制
        cv.width = w * dpr; cv.height = h * dpr;
        cv.style.width = w + 'px'; cv.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // 离屏栅格化文字 → 采样目标点（文字居中偏下，留足上方飞行空间）
        const off = document.createElement('canvas');
        off.width = w; off.height = h;
        const oc = off.getContext('2d');
        oc.font = '800 ' + fontSize + 'px ' + FONT;
        oc.textAlign = 'center'; oc.textBaseline = 'middle';
        oc.fillStyle = '#fff';
        oc.fillText(TEXT, w / 2, h * 0.88);     // 屏幕约 44% 处（画布高 50vh → 0.88h）
        const data = oc.getImageData(0, 0, w, h).data;
        const step = fontSize > 90 ? 3 : 2;
        const pts = [];
        for (let y = 0; y < h; y += step) {
          for (let x = 0; x < w; x += step) {
            if (data[(y * w + x) * 4 + 3] > 128) pts.push({ x, y });
          }
        }
        // 粒子数量上限：超出时均匀随机丢弃，保持字形完整
        const MAX = 1500;
        let use = pts;
        if (pts.length > MAX) {
          use = [];
          const keep = MAX / pts.length;
          for (let i = 0; i < pts.length; i++) if (Math.random() < keep) use.push(pts[i]);
        }
        // 两阶段：先错峰以流星形态从上方飞掠而下，到点后拖尾收起、聚合成字形
        parts = use.map(function(pt) {
          const mp = METEOR_PALETTE[Math.floor(Math.random() * METEOR_PALETTE.length)];
          return {
            x: pt.x + (Math.random() - 0.5) * w * 0.8 - (pt.x - w / 2) * 0.25, // 起始横向略微向中心收拢
            y: -60 - Math.random() * h * 1.3,        // 起点在画布外上方，飞入自然
            vx: (Math.random() - 0.5) * 16,          // 极轻微横向偏移（与背景流星一致）
            vy: 110 + Math.random() * 100,           // 流星向下飞掠（px/s）
            len: 26 + Math.random() * 34,            // 拖尾长度
            born: -Math.random() * 0.9,              // 错峰入场（秒）
            fallT: 1.4 + Math.random() * 1.9,        // 飞掠时长，之后进入聚合
            fadeIn: 0.45,                            // 入场淡入，避免凭空出现
            tx: pt.x, ty: pt.y,
            size: 1.6 + Math.random() * 1.2,         // 亮核大小
            phase: Math.random() * Math.PI * 2,
            hex: mp[0], rgb: mp[1],
            alpha: 0.85 + Math.random() * 0.15
          };
        });
      }

      function drawStatic() {
        ctx.clearRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = p.hex;
          ctx.beginPath(); ctx.arc(p.tx, p.ty, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

      function frame(now) {
        if (!lastT) lastT = now;
        const dt = Math.min((now - lastT) / 1000, 0.05);
        lastT = now;
        const t = now / 1000 - startT;
        ctx.clearRect(0, 0,  w, h);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          const lt = t + p.born;
          if (lt <= 0) continue;
          if (lt < p.fallT) {
            // 阶段1：流星从上方飞掠而下
            p.vy += 22 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
          } else {
            // 阶段2：强力弹簧吸附到文字目标点，拖尾收起聚成亮核
            const k = 5, damp = Math.exp(-3 * dt);
            p.vx = (p.vx + (p.tx - p.x) * k * dt) * damp;
            p.vy = (p.vy + (p.ty - p.y) * k * dt) * damp;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.len *= Math.exp(-3.5 * dt);
          }
          p.phase += 2 * dt;
          // 入场淡入：从页面最上方飞入时透明度由 0 渐显，避免突兀
          const fade = Math.min(1, lt / p.fadeIn);
          // 流星绘制：渐变拖尾 + 亮核（与背景流星同款手法）
          const sp = Math.hypot(p.vx, p.vy) || 1;
          const tailX = p.x - (p.vx / sp) * p.len;
          const tailY = p.y - (p.vy / sp) * p.len;
          const a = p.alpha * fade * (lt < p.fallT ? (0.7 + 0.3 * Math.sin(p.phase * 3)) : 0.9);
          const grad = ctx.createLinearGradient(tailX, tailY, p.x, p.y);
          grad.addColorStop(0, 'rgba(' + p.rgb + ',0)');
          grad.addColorStop(1, 'rgba(' + p.rgb + ',' + a + ')');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
          // 亮核 + 微光呼吸
          const px = p.x + Math.sin(p.phase) * 0.3;
          const py = p.y + Math.cos(p.phase * 0.9) * 0.25;
          ctx.globalAlpha = a * 0.18;
          ctx.fillStyle = p.hex;
          ctx.beginPath(); ctx.arc(px, py, p.size * 2.4, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = a;
          ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        raf = requestAnimationFrame(frame);
      }

      let resizeTimer = null;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          build();
          if (reduce) drawStatic();
        }, 200);
      });

      splashNameFx = {
        start: function() {
          if (started) return;
          started = true;
          build();
          startT = performance.now() / 1000;
          lastT = null;
          if (reduce) { drawStatic(); return; }
          if (!raf) raf = requestAnimationFrame(frame);
        },
        stop: function() {
          if (raf) { cancelAnimationFrame(raf); raf = null; }
        }
      };

      // 预加载中文字体，确保字形采样正确（避免方框/乱码）；异常时 1.8s 兜底启动
      const startName = function() { splashNameFx.start(); };
      if (document.fonts && document.fonts.load) {
        Promise.all([
          document.fonts.ready,
          document.fonts.load('800 120px "Microsoft YaHei"'),
          document.fonts.load('800 120px "PingFang SC"'),
          document.fonts.load('800 120px "Noto Sans SC"')
        ]).then(startName, startName);
        setTimeout(startName, 1800);
      } else if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(startName);
        setTimeout(startName, 1800);
      } else {
        startName();
      }
    })();

    let splashParticles = initSplashParticles();
    if (splashParticles) splashParticles.start(); // 首屏即开始粒子动画
    function hideSplash() {
      const splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('is-hidden');
      if (splashParticles) splashParticles.stop();
      if (splashNameFx) splashNameFx.stop();
      const mainEl = document.getElementById('main');
      if (mainEl) mainEl.focus({ preventScroll: true }); // 进入后焦点回到主内容
    }

    // 开屏「打开我的简历」按钮：点击进入简历
    const enterResumeBtn = document.getElementById('enterResumeBtn');
    if (enterResumeBtn) {
      enterResumeBtn.addEventListener('click', hideSplash);
      enterResumeBtn.focus({ preventScroll: true }); // 键盘用户可直接回车进入
    }
    // 兜底：若用户一直未点击，12s 后自动进入（避免卡在开屏）
    setTimeout(hideSplash, 12000);

    // 鼠标光标背景高亮（平滑跟随，触屏/减动效跳过）
    (function initCursorGlow() {
      const glow = document.getElementById('cursorGlow');
      if (!glow) return;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      let raf = null, tx = window.innerWidth / 2, ty = window.innerHeight / 2, cx = tx, cy = ty;
      function loop() {
        cx += (tx - cx) * 0.18; cy += (ty - cy) * 0.18;
        glow.style.setProperty('--mx', cx + 'px');
        glow.style.setProperty('--my', cy + 'px');
        if (Math.abs(tx - cx) > 0.5 || Math.abs(ty - cy) > 0.5) {
          raf = requestAnimationFrame(loop);
        } else { raf = null; }
      }
      window.addEventListener('mousemove', (e) => {
        tx = e.clientX; ty = e.clientY;
        glow.classList.add('active');
        if (!raf) raf = requestAnimationFrame(loop);
      }, { passive: true });
      document.addEventListener('mouseleave', () => glow.classList.remove('active'));
      window.addEventListener('touchstart', () => glow.classList.remove('active'), { passive: true });
    })();

    // 滚动入场 + 技能条填充 + 数字滚动（统一由 IntersectionObserver 驱动）
    (function initReveal() {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // 给各 section 内容块加 reveal（hero 也在视口内，加载即触发）
      const blocks = document.querySelectorAll('section > div.max-w-5xl');
      blocks.forEach(b => b.classList.add('reveal'));

      function countUp(el) {
        const target = parseInt(el.getAttribute('data-target'), 10) || 0;
        const prefix = el.getAttribute('data-prefix') || '';
        const suffix = el.getAttribute('data-suffix') || '';
        if (reduce) { el.textContent = prefix + target + suffix; return; }
        const dur = 1300, start = performance.now();
        function tick(now) {
          const p = Math.min(1, (now - start) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = prefix + Math.round(target * eased) + suffix;
          if (p < 1) requestAnimationFrame(tick);
          else el.textContent = prefix + target + suffix;
        }
        requestAnimationFrame(tick);
      }

      const revObs = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          const el = en.target;
          el.classList.add('is-visible');
          el.querySelectorAll('.skill-fill').forEach(f => { f.style.width = f.getAttribute('data-level') + '%'; });
          el.querySelectorAll('.metric-number[data-target]').forEach(countUp);
          revObs.unobserve(el);
        });
      }, { rootMargin: '0px 0px -10% 0px', threshold: 0.15 });
      blocks.forEach(b => revObs.observe(b));
    })();

    // 顶部阅读进度条
    (function initScrollProgress() {
      const bar = document.getElementById('readProgress');
      if (!bar) return;
      let ticking = false;
      function update() {
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        const top = h.scrollTop || document.body.scrollTop || 0;
        bar.style.width = (max > 0 ? (top / max) * 100 : 0) + '%';
        ticking = false;
      }
      window.addEventListener('scroll', () => {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
      update();
    })();

    // 玻璃卡片光标聚光（hover 时跟随鼠标的高光）
    (function initCardSpotlight() {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      document.addEventListener('mousemove', (e) => {
        const card = e.target.closest && e.target.closest('.glass-card');
        if (!card) return;
        const r = card.getBoundingClientRect();
        card.style.setProperty('--cx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--cy', (e.clientY - r.top) + 'px');
      }, { passive: true });
    })();
  });
</script>
</body>
