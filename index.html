  .glow-bg {

    left: 0;
    right: 0;

    z-index: 0;

  }

    height: 650px;
    background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);

    border-radius: 50%;

  .glow-bg::after {
    content: '';
    position: absolute;
    bottom: -200px;
    right: -200px;
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, rgba(79,70,229,0.15) 0%, transparent 70%);

    transition: all 0.2s ease;

  .glass-card:hover {
    border-color: rgba(34, 211, 238, 0.3);

    background: rgba(6, 182, 212, 0.15);
    border-color: rgba(6, 182, 212, 0.4);
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);

    left: 50%;

    width: 0;
    height: 2px;
    background: #06b6d4;

  }

  }

    transform: translateY(-4px);

          "包含旅游（上海、新疆、贵州等）与日常点滴",
          "通过作品集展示个人审美与观察力"
        ],
        link: "#",
        isGallery: true
      }
    ],
    skills: [
      {
        category: "语言能力",
        icon: "languages",
        items: [
          { name: "俄语", level: 73 },
          { name: "普通话", level: 95 },
          { name: "英语（基础）", level: 50 }
        ]
      },
      {
        category: "专业工具",
        icon: "wrench",
        items: [
          { name: "AutoCAD", level: 60 },
          { name: "Aspen Plus", level: 50 },
          { name: "Origin", level: 70 },
          { name: "ChemOffice", level: 55 },
          { name: "Office", level: 85 }
        ]
      },
      {
        category: "领域知识",
        icon: "book-open",
        items: [
          { name: "化工基础", level: 60 },
          { name: "无机化学", level: 55 },
          { name: "AI基础与数据标注", level: 65 }
        ]
      }
    ],
    education: {
      school: "常州工学院",
      degree: "本科",
      major: "化学工程与工艺",
      period: "2026.09 - 2030.06（预计）",
      gpa: "待补",
      courses: ["化工原理", "物理化学", "有机化学", "无机及分析化学", "化工热力学", "化学反应工程"]
    },
    certificates: [
      { name: "达摩院初级人工智能训练师", issuer: "阿里巴巴达摩院", year: "2026", level: "初级", img: "zs1.jpg" },
      { name: "达摩院高级人工智能训练师", issuer: "阿里巴巴达摩院", year: "2026", level: "高级", img: "zs2.jpg" }
    ],
    galleryImages: [
      "worek_1.jpg"
    ]
  };

  document.addEventListener('DOMContentLoaded', () => {
    // 初始化 Lucide 图标
    lucide.createIcons();

    // Hero
    document.getElementById('heroSummary').textContent = resume.hero.summary;
    const badgeList = document.getElementById('heroBadges');
    resume.hero.badges.forEach(b => {
      const span = document.createElement('span');
      span.className = 'badge-pill';
      span.textContent = b;
      badgeList.appendChild(span);
    });

    // 亮点
    const highlightGrid = document.getElementById('highlightGrid');
    resume.highlights.forEach(h => {
      const card = document.createElement('div');
      card.className = 'metric-card glass-card p-4 md:p-6 text-center';
      card.innerHTML = `
        <div class="text-2xl md:text-3xl mb-2 flex items-center justify-center">
          <i data-lucide="${h.icon}" class="w-6 h-6 md:w-7 md:h-7 text-cyan-400"></i>
        </div>
        <div class="metric-number text-2xl md:text-4xl">${h.metric}</div>
        <div class="text-xs md:text-sm text-slate-400 mt-1">${h.label}</div>
      `;
      highlightGrid.appendChild(card);
    });

    // 经历 Tabs
    const expTypes = [...new Set(resume.experiences.map(e => e.type))];
    const expTabs = document.getElementById('expTabs');
    const expPanels = document.getElementById('expPanels');
    expTypes.forEach((type, idx) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn-custom py-2 px-3 md:px-4 rounded-lg text-xs md:text-sm font-medium text-slate-400';
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
      btn.textContent = type;
      btn.addEventListener('click', () => activateTab(expTabs, expPanels, idx));
      expTabs.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'tab-panel-custom ' + (idx === 0 ? 'active' : 'hidden');
      panel.setAttribute('role', 'tabpanel');
      const filtered = resume.experiences.filter(e => e.type === type);
      filtered.forEach(exp => {
        const card = document.createElement('div');
        card.className = 'glass-card p-4 md:p-5 mb-3';
        card.innerHTML = `
          <div class="flex flex-col gap-2 mb-3">
            <div class="flex items-center gap-2">
              <i data-lucide="building-2" class="w-4 h-4 text-cyan-400"></i>
              <span class="text-base md:text-lg font-bold text-white">${exp.company}</span>
            </div>
            <div class="text-sm text-indigo-300 font-medium">${exp.role}</div>
            <div class="text-xs text-slate-500">${exp.period}</div>
          </div>
          <ul class="space-y-1.5">
            ${exp.points.map(p => `
              <li class="flex items-start gap-2 text-sm text-slate-300">
                <span class="text-cyan-400 mt-0.5">▹</span>
                <span>${p}</span>
              </li>
            `).join('')}
          </ul>
        `;
        panel.appendChild(card);
      });
      expPanels.appendChild(panel);
    });

    // 生活瞬间 Tabs
    const projTabs = document.getElementById('projTabs');
    const projPanels = document.getElementById('projPanels');
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn-custom py-2 px-3 md:px-4 rounded-lg text-xs md:text-sm font-medium text-slate-400';
    tabBtn.setAttribute('role', 'tab');
    tabBtn.setAttribute('aria-selected', 'true');
    tabBtn.textContent = '生活瞬间';
    tabBtn.addEventListener('click', () => activateTab(projTabs, projPanels, 0));
    projTabs.appendChild(tabBtn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel-custom active';
    panel.setAttribute('role', 'tabpanel');
    const grid = document.createElement('div');
    grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4';
    resume.galleryImages.forEach((imgSrc, index) => {
      const item = document.createElement('div');
      item.className = 'glass-card overflow-hidden cursor-pointer aspect-square rounded-xl transition-all hover:scale-[1.02] hover:border-cyan-400/40';
      item.setAttribute('tabindex', '0');
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', `查看生活瞬间图片 ${index + 1}`);
      const img = document.createElement('img');
      img.src = imgSrc;
      img.alt = `生活瞬间图片 ${index + 1}`;
      img.loading = 'lazy';
      img.className = 'w-full h-full object-cover';
      img.onerror = function() { this.parentElement.style.display = 'none'; };
      item.appendChild(img);
      item.addEventListener('click', () => openLightbox(imgSrc, `生活瞬间图片 ${index + 1}`));
      item.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox(imgSrc, `生活瞬间图片 ${index + 1}`);
        }
      });
      grid.appendChild(item);
    });
    panel.appendChild(grid);
    projPanels.appendChild(panel);

    // 技能矩阵
    const skillsGrid = document.getElementById('skillsGrid');
    resume.skills.forEach(cat => {
      const div = document.createElement('div');
      div.className = 'glass-card p-4 md:p-5';
      let itemsHtml = '';
      cat.items.forEach(item => {
        itemsHtml += `
          <div class="mb-3 last:mb-0">
            <div class="flex justify-between items-center mb-1.5">
              <span class="text-xs md:text-sm font-medium text-slate-200">${item.name}</span>
              <span class="text-xs text-slate-500">${item.level}%</span>
            </div>
            <div class="h-1.5 bg-white/5 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400" style="width:${item.level}%; transition:width 0.6s ease;"></div>
            </div>
          </div>
        `;
      });
      div.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="${cat.icon}" class="w-4 h-4 text-cyan-400"></i>
          <h3 class="text-sm md:text-base font-bold text-white">${cat.category}</h3>
        </div>
        ${itemsHtml}
      `;
      skillsGrid.appendChild(div);
    });

    // 教育
    const eduCard = document.getElementById('eduCard');
    eduCard.innerHTML = `
      <div class="flex items-center gap-3">
        <i data-lucide="school" class="w-6 h-6 text-cyan-400"></i>
        <div>
          <div class="text-lg md:text-xl font-extrabold text-white">${resume.education.school}</div>
          <div class="text-sm text-indigo-300 font-medium">${resume.education.major} · ${resume.education.degree}</div>
          <div class="text-xs text-slate-500">${resume.education.period}</div>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 mt-3">
        ${resume.education.courses.map(c => `<span class="badge-pill">${c}</span>`).join('')}
      </div>
    `;

    // 证书
    const certList = document.getElementById('certList');
    resume.certificates.forEach(cert => {
      const div = document.createElement('div');
      div.className = 'glass-card p-4 flex items-start gap-3';
      const detail = [cert.issuer, cert.year, cert.level].filter(d => d && d !== '' && d !== '待补').join(' · ');
      let imgHtml = '';
      if (cert.img) {
        imgHtml = `<img src="${cert.img}" alt="${cert.name}" class="cert-img w-full mt-2 rounded-lg border border-white/10" loading="lazy">`;
      }
      div.innerHTML = `
        <i data-lucide="award" class="w-5 h-5 text-cyan-400 flex-shrink-0 mt-0.5"></i>
        <div class="flex-1">
          <div class="text-sm md:text-base font-bold text-white">${cert.name}</div>
          <div class="text-xs text-slate-500">${detail}</div>
          ${imgHtml}
        </div>
      `;
      certList.appendChild(div);
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(src, caption) {
      lightboxImg.src = src;
      lightboxCaption.textContent = caption;
      lightbox.classList.remove('hidden');
      lightbox.classList.add('flex');
      setTimeout(() => { lightbox.classList.remove('opacity-0'); }, 10);
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.add('opacity-0');
      setTimeout(() => {
        lightbox.classList.add('hidden');
        lightbox.classList.remove('flex');
        lightboxImg.src = '';
        lightboxCaption.textContent = '';
      }, 200);
      document.body.style.overflow = '';
    }
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    // 返回顶部
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        backToTop.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        backToTop.classList.add('opacity-0', 'pointer-events-none');
      }
    }, { passive: true });
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // 打印
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    // 通用复制函数 + Toast
    const toast = document.getElementById('toast');
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => { toast.classList.remove('visible'); }, 2200);
    }
    function copyText(text, successMsg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast('✅ ' + successMsg));
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('✅ ' + successMsg);
      }
    }

    // 邮箱复制
    document.getElementById('copyEmailBtn').addEventListener('click', () => {
      copyText(resume.personal.email, '邮箱已复制');
    });

    // QQ 复制
    document.getElementById('copyQQBtn').addEventListener('click', () => {
      copyText('2314514243', 'QQ 已复制');
    });

    // 微信复制
    document.getElementById('copyWeChatBtn').addEventListener('click', () => {
      copyText('chen_20071118', '微信已复制');
    });

    // Tab 激活
    function activateTab(tabList, panelContainer, index) {
      const tabs = tabList.querySelectorAll('.tab-btn-custom');
      const panels = panelContainer.querySelectorAll('.tab-panel-custom');
      tabs.forEach((t, i) => {
        t.setAttribute('aria-selected', i === index ? 'true' : 'false');
      });
      panels.forEach((p, i) => {
        if (i === index) {
          p.classList.remove('hidden');
          p.classList.add('active');
        } else {
          p.classList.add('hidden');
          p.classList.remove('active');
        }
      });
    }

    // 键盘 Tab 切换
    document.querySelectorAll('.tabs-custom').forEach(tabList => {
      const tabs = tabList.querySelectorAll('.tab-btn-custom');
      tabList.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          const currentIndex = Array.from(tabs).findIndex(t => t.getAttribute('aria-selected') === 'true');
          let nextIndex = e.key === 'ArrowRight' ? (currentIndex + 1) % tabs.length : (currentIndex - 1 + tabs.length) % tabs.length;
          tabs[nextIndex].click();
          tabs[nextIndex].focus();
          e.preventDefault();
        }
      });
    });

    // 重新初始化图标（包含新按钮）
    lucide.createIcons();
  });
</script>
</body>
</html>
